[project]
name = "staged-pipeline"
version = "0.1.0a1"
description = "Декларативный конвейер стадий поверх asyncio: воркеры, dedup, ретраи, прогресс"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "0cherednoq" }]
keywords = ["asyncio", "pipeline", "dataflow", "seda"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
# Пустой extra: интеграция с Tallyho не тянет внешних пакетов (мост через Protocol,
# architecture.md §9.3). Extra существует как маркер намерения для документации и
# как точка расширения, если интеграции когда-нибудь понадобится зависимость.
tallyho = []

[project.urls]
Homepage = "https://github.com/0cherednoq/staged-pipeline"
Repository = "https://github.com/0cherednoq/staged-pipeline"
Issues = "https://github.com/0cherednoq/staged-pipeline/issues"
Changelog = "https://github.com/0cherednoq/staged-pipeline/blob/main/CHANGELOG.md"

# Проект — самостоятельный workspace-корень: это изолирует его от родительского
# workspace (напр. ~/pyproject.toml), если репозиторий лежит внутри него. На CI,
# где склонирован только этот репозиторий, секция безвредна.
[tool.uv.workspace]
members = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/staged_pipeline"]

# --------------------------------------------------------------------------- #
# Группы инструментов. Версии закреплены (==), ставятся из кэша uv (D-009).    #
# codespell и check-jsonschema намеренно вне групп (D-009): их нет в кэше, а   #
# одна некэшированная зависимость роняет весь оффлайн-`uv sync`.               #
# --------------------------------------------------------------------------- #
[dependency-groups]
lint = [
    "ruff==0.17.2",
    "mypy==2.4.0",
    "basedpyright==1.40.1",
    "import-linter==2.15",
    "validate-pyproject==0.26",
]
test = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "pytest-timeout==2.4.0",
    "hypothesis==6.168.1",
    # coverage закреплён на кэшированную версию (pytest-cov тянет новее, блоба нет — D-009).
    "coverage==7.15.4",
]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    "poethepoet==0.49.0",
    "pre-commit==4.7.0",
]

# --------------------------------------------------------------------------- #
# poe-задачи                                                                  #
# --------------------------------------------------------------------------- #
[tool.poe.tasks]
fmt = { cmd = "ruff format", help = "Отформатировать код" }
_fmtcheck = "ruff format --check"
_ruff = "ruff check"
lint = { sequence = ["_fmtcheck", "_ruff"], help = "ruff: формат-чек и правила" }
_mypy = "mypy"
_pyright = "basedpyright"
types = { sequence = ["_mypy", "_pyright"], help = "mypy --strict и basedpyright (all)" }
api = { cmd = "basedpyright --verifytypes staged_pipeline --ignoreexternal", help = "Полнота типов публичного API" }
imports = { cmd = "lint-imports", help = "import-linter: слои и запреты" }
deps = { cmd = "uvx deptry src", help = "deptry через uvx (не в lock — нужна сеть/кэш, D-009)" }
spell = { cmd = "uvx codespell src tests docs README.md CHANGELOG.md AGENTS.md", help = "codespell через uvx (нужна сеть/кэш, D-009)" }
test = { cmd = "pytest", help = "Тесты + покрытие" }
# Локальный оффлайн-гейт (D-009). deptry, codespell и check-github-workflows — на CI.
check = { sequence = ["lint", "types", "api", "imports", "test"], help = "Полный локальный гейт (оффлайн)" }
bench = { cmd = "python scripts/bench.py", help = "Бенчмарк оверхеда на элемент (не гейт)" }
github = { cmd = "python scripts/github_bootstrap.py", help = "Настроить GitHub-репозиторий из .env (T7.1)" }

# --------------------------------------------------------------------------- #
# ruff                                                                        #
# --------------------------------------------------------------------------- #
[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]
# ruff 0.17 форматирует Python-блоки в Markdown; документы — не наш код-стайл.
extend-exclude = ["*.md", "docs"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",  # конфликтует с форматтером (висячая запятая)
    "ISC001",  # конфликтует с форматтером (неявная конкатенация строк)
    "ISC003",  # конфликтует с basedpyright reportImplicitStringConcatenation (нужен явный +)
    "D203",    # несовместимо с D211 (пустая строка перед docstring класса)
    "D213",    # несовместимо с D212 (multi-line summary на второй строке)
    "TD002",   # автор у TODO не требуется
    "TD003",   # ссылка на issue у TODO не требуется
    "FIX002",  # наличие TODO — не ошибка
    "CPY001",  # заголовок с копирайтом в каждом файле не требуется
    "RUF001",  # комментарии/docstring на русском (§0.3): кириллица — не ошибка
    "RUF002",  # то же для docstring
    "RUF003",  # то же для комментариев
    "EM101",   # текст ошибки инлайном — читаемее, чем обязательная переменная
    "EM102",   # то же для f-string
    "TRY003",  # длинные тексты в raise допустимы (§7.6 требует понятных сообщений)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["staged_pipeline"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.Any".msg = "Any запрещён (§0.3): конкретный тип или Protocol."
"asyncio.get_event_loop".msg = "Запрещено (§0.3): asyncio.get_running_loop()."
"logging.basicConfig".msg = "Запрещено (§0.3): библиотека не трогает корневой логгер."
"unittest.mock.patch".msg = "Запрещено (§0.3): без monkeypatching реального кода."

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107", "ANN", "ARG002", "PLR2004", "SLF001", "INP001", "N818", "PLR0913"]
"examples/**" = ["D", "INP001", "T201", "ANN"]
"scripts/**" = ["D", "INP001", "T201", "S603", "S607"]

# --------------------------------------------------------------------------- #
# mypy (strict)                                                               #
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.13"
files = ["src", "tests"]
mypy_path = "examples"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
# disallow_any_explicit НЕ включаем: он считает `Callable[..., object]` (тип
# динамически разбираемого хендлера) за Any. Литеральный `typing.Any` и так
# запрещён ruff banned-api (§0.3).
enable_error_code = ["redundant-expr", "truthy-bool", "ignore-without-code", "possibly-undefined"]

# --------------------------------------------------------------------------- #
# basedpyright (строжайший режим)                                             #
# --------------------------------------------------------------------------- #
[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.13"
include = ["src", "tests"]
extraPaths = ["examples"]
# Непрактичные в тестах/коде правила «all»-режима; отключены точечно и с причиной.
reportUnusedCallResult = false       # ctx.incr(...) и т.п. намеренно игнорируют результат
reportUnnecessaryTypeIgnoreComment = true

# Тесты — белый ящик: обращение к внутренним полям и непроаннотированные
# атрибуты фикстур допустимы.
[[tool.basedpyright.executionEnvironments]]
root = "tests"
reportPrivateUsage = false
reportUnannotatedClassAttribute = false
reportUnusedParameter = false  # фиктивные хендлеры в тестах не используют параметры

# --------------------------------------------------------------------------- #
# pytest + coverage                                                           #
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config --cov=staged_pipeline --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]
asyncio_mode = "auto"
timeout = 5
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["staged_pipeline"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "^\\s*\\.\\.\\.\\s*$",
    "if __name__ == .__main__.:",
]

# --------------------------------------------------------------------------- #
# deptry (запускается через uvx, не входит в lock — D-009)                     #
# --------------------------------------------------------------------------- #
[tool.deptry]
known_first_party = ["staged_pipeline"]

# --------------------------------------------------------------------------- #
# codespell (запускается через uvx / pre-commit — D-009)                      #
# --------------------------------------------------------------------------- #
[tool.codespell]
skip = "*.lock,./.git,./.venv"
# Комментарии и docstring на русском; английские «ложные» слова добавлять сюда.
ignore-words-list = ""

# --------------------------------------------------------------------------- #
# import-linter                                                               #
# --------------------------------------------------------------------------- #
# На скелете действует только forbidden-контракт (D-010): ядро и интеграции не
# импортируют tallyho (architecture.md §9.3). Полное расслоение добавляется с
# T1.1 по мере появления модулей. Целевые слои (PLAN.md T0.2, сверху вниз):
#   integrations | testing
#   _pipeline
#   _stage | _supervisor
#   _accounting | _progress | _policy | _limit | _inbox | _graph
#   _errors | _clock | _types
[tool.importlinter]
root_package = "staged_pipeline"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Ядро и интеграции не импортируют tallyho"
type = "forbidden"
source_modules = ["staged_pipeline"]
forbidden_modules = ["tallyho"]

# Слоевой контракт, растёт по мере появления модулей (D-010). Сверху вниз:
# верхний слой может импортировать нижние, но не наоборот; модули внутри одного
# слоя (через `|`) независимы друг от друга.
[[tool.importlinter.contracts]]
name = "Слои пакета"
type = "layers"
containers = ["staged_pipeline"]
layers = [
    "integrations | testing",
    "_pipeline",
    "_stage",
    "_progress",
    "_supervisor",
    "_accounting",
    "_graph",
    "_inbox | _policy | _limit",
    "_errors | _clock",
]
